server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Legacy tender → proposal 301 redirects. Crawler-friendly (proper
    # HTTP 301, not a JS-side navigate) so Googlebot updates its index.
    # Note: nginx:alpine's envsubst-on-templates.sh runs against .conf files
    # and eats bare ${var} — so avoid `${is_args}`. Also avoid pcre `{N}`
    # quantifiers here for the same reason; a permissive pattern suffices
    # since /tenders/* only matched real UUIDs historically.
    location = /tenders {
        return 301 /;
    }
    location = /tenders/new {
        return 301 /proposal/new;
    }
    location ~ ^/tenders/(.+)$ {
        return 301 /proposal/$1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Every SPA route is answered by an internal redirect to /index.html, so
    # this is the one place its caching is decided. Without a Cache-Control
    # the browser falls back to heuristic freshness -- a tenth of the time
    # since Last-Modified, days on a quiet deploy cadence -- and after a
    # deploy keeps running an index.html that names assets which no longer
    # exist. no-cache still lets it reuse the copy after a cheap revalidation.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Build output is content-hashed: a changed file gets a new name, so any
    # given name can be cached for good. A name that does not exist is a stale
    # page asking for an old build -- answer 404 rather than falling back to
    # index.html, which the browser would try to run as a script.
    location ^~ /assets/ {
        try_files $uri =404;
        error_page 404 = @asset_missing;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location @asset_missing {
        return 404;
    }

    error_page 404 /index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;
}
